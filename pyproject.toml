[build-system]
requires = ["setuptools>=75,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "chunkeval"
version = "0.1.0"
description = "Local Indonesian legal PDF chunking and E5 retrieval experiment"
requires-python = ">=3.10"
dependencies = [
  "pypdf>=4,<5", "pytesseract>=0.3.13,<0.4", "pdf2image>=1.17,<2",
  "transformers>=4.41,<5", "sentence-transformers>=3.4,<4", "torch>=2.2,<3",
  "numpy>=1.26,<2", "faiss-cpu>=1.8,<2", "PyYAML>=6,<7",
  "langchain==0.3.27", "langchain-experimental==0.3.4",
  "langchain-core>=0.3.72,<0.4", "langchain-community>=0.3,<0.4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
chunkeval = "chunkeval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

